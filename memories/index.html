  (function () {
    document.querySelectorAll('.memories-strip').forEach(function (strip) {
      var track = strip.querySelector('.memories-track');
      var prev = strip.querySelector('.memories-prev');
      var next = strip.querySelector('.memories-next');
      if (!track || !prev || !next) return;
      var step = function () {
        return Math.max(220, Math.floor(track.clientWidth * 0.75));
      };
      prev.addEventListener('click', function () {
        track.scrollBy({ left: -step(), behavior: 'smooth' });
      });
      next.addEventListener('click', function () {
        track.scrollBy({ left: step(), behavior: 'smooth' });
      });
    });

    var activePlace = null;

    document.querySelectorAll('.memories-place').forEach(function (place) {
      var thumbs = Array.prototype.slice.call(place.querySelectorAll('.memories-thumb'));
      var stage = place.querySelector('.memories-stage');
      var stageImg = place.querySelector('.memories-stage-img');
      var stageCaption = place.querySelector('.memories-stage-caption');
      var closeBtn = place.querySelector('.memories-stage-close');
      var stagePrev = place.querySelector('.memories-stage-prev');
      var stageNext = place.querySelector('.memories-stage-next');
      if (!stage || !stageImg || !closeBtn || !thumbs.length) return;

      var index = 0;

      function show(i) {
        if (!thumbs.length) return;
        index = (i + thumbs.length) % thumbs.length;
        var btn = thumbs[index];
        var caption = btn.getAttribute('data-alt') || '';
        stageImg.src = btn.getAttribute('data-full');
        stageImg.alt = caption;
        if (stageCaption) {
          stageCaption.textContent = caption;
          stageCaption.hidden = !caption;
        }
        stage.hidden = false;
        activePlace = place;
        thumbs.forEach(function (el) {
          el.classList.toggle('is-active', el === btn);
        });
        btn.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
        stage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function closeStage() {
        stage.hidden = true;
        stageImg.removeAttribute('src');
        if (stageCaption) {
          stageCaption.textContent = '';
          stageCaption.hidden = true;
        }
        thumbs.forEach(function (el) {
          el.classList.remove('is-active');
        });
        if (activePlace === place) activePlace = null;
      }

      place._memoriesShow = show;
      place._memoriesClose = closeStage;
      place._memoriesIndex = function () {
        return index;
      };

      thumbs.forEach(function (btn, i) {
        btn.addEventListener('click', function () {
          show(i);
        });
      });

      if (stagePrev) {
        stagePrev.addEventListener('click', function () {
          show(index - 1);
        });
      }
      if (stageNext) {
        stageNext.addEventListener('click', function () {
          show(index + 1);
        });
      }
      closeBtn.addEventListener('click', closeStage);
    });

    document.addEventListener('keydown', function (e) {
      if (!activePlace || !activePlace._memoriesShow) return;
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        activePlace._memoriesShow(activePlace._memoriesIndex() - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        activePlace._memoriesShow(activePlace._memoriesIndex() + 1);
      } else if (e.key === 'Escape') {
        activePlace._memoriesClose();
      }
    });
  })();
</script> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Ajay M. Rawat. Hosted by <a href="https://pages.github.com/" target="_blank" rel="external nofollow noopener">GitHub Pages</a>. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?c15de51d4bb57887caa2c21988d97279"></script> <script defer src="/assets/js/copy_code.js?c8a01c11a92744d44b093fc3bda915df" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab.js?d9f17b6adc2311cbabd747f4538bb15f"></script> <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script> <script async src="https://badge.dimensions.ai/badge.js"></script> <script defer type="text/javascript" i
