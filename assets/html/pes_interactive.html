<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Potential Energy Surface — Sampling to Dynamics</title>
<style>
  :root{
    --paper:#f2efe6;
    --ink:#1b2430;
    --muted:#83887f;
    --teal:#0f6f66;
    --copper:#b5541c;
    --gold:#d1a13a;
    --line: rgba(27,36,48,0.10);
    --bar-track: rgba(27,36,48,0.08);
    --bar-fill: #a9d8d0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12161c;
      --ink:#eef0ea;
      --muted:#8b9199;
      --line: rgba(255,255,255,0.10);
      --bar-track: rgba(255,255,255,0.08);
      --bar-fill: rgba(20,184,166,0.38);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12161c;
    --ink:#eef0ea;
    --muted:#8b9199;
    --line: rgba(255,255,255,0.10);
    --bar-track: rgba(255,255,255,0.08);
    --bar-fill: rgba(20,184,166,0.38);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
  }
  .pes-wrap{
    max-width:980px;
    margin:0 auto;
    padding:0.55rem 0.9rem 0.65rem;
    height:100%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .pes-intro{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:1.5rem;
    margin-bottom:0.85rem;
    flex-wrap:wrap;
    flex-shrink:0;
  }
  .pes-intro p{
    margin:0;
    max-width:52ch;
    font-size:1.12rem;
    font-weight:600;
    line-height:1.35;
    color:var(--ink);
  }
  .pes-intro .hint{
    margin:0;
    font-size:0.76rem;
    font-weight:400;
    color:var(--muted);
    white-space:nowrap;
  }
  .pes-stage{
    display:block;
    margin:0.35rem 0 0;
    font-size:0.86rem;
    font-style:italic;
    color:var(--muted);
    min-height:1.35em;
    line-height:1.35;
    flex-shrink:0;
  }
  .pes-canvas-frame{
    position:relative;
    width:100%;
    flex:1 1 auto;
    min-height:0;
    border-radius:14px;
    overflow:hidden;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/32px 32px,
      var(--paper);
    border:1px solid var(--line);
    touch-action:none;
    cursor:grab;
  }
  .pes-canvas-frame:active{ cursor:grabbing; }
  .pes-canvas-frame canvas{ display:block; width:100%; height:100%; }

  .pes-controls{
    display:flex;
    align-items:center;
    gap:0.9rem;
    margin-top:0.45rem;
    flex-shrink:0;
  }
  .pes-play{
    flex:0 0 auto;
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .pes-play:hover{ border-color:var(--copper); color:var(--copper); }
  .pes-play svg{ width:14px; height:14px; }

  .pes-speed{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:0.4rem;
    min-width:0;
  }
  .pes-speed label{
    font-size:0.68rem;
    color:var(--muted);
    white-space:nowrap;
    user-select:none;
  }
  .pes-speed input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:78px;
    height:4px;
    border-radius:999px;
    background:var(--bar-track);
    outline:none;
    cursor:pointer;
  }
  .pes-speed input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--ink);
    border:2px solid var(--paper);
    box-shadow:0 0 0 1px var(--line);
    cursor:pointer;
  }
  .pes-speed input[type="range"]::-moz-range-thumb{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--ink);
    border:2px solid var(--paper);
    box-shadow:0 0 0 1px var(--line);
    cursor:pointer;
  }
  .pes-speed #pesSpeedVal{
    font-size:0.68rem;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum";
    width:3.4em;
    flex:0 0 3.4em;
    text-align:right;
    white-space:nowrap;
  }

  .pes-stepper{
    flex:1 1 auto;
    position:relative;
    height:34px;
  }
  .pes-stepper svg{ width:100%; height:100%; overflow:visible; display:block; }
  .pes-node{ cursor:pointer; }
  .pes-node text{
    font-family:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;
    font-size:11.5px;
    fill:var(--muted);
    user-select:none;
  }
  .pes-node.active text{ fill:var(--ink); font-weight:600; }
  .pes-node.done text{ fill:var(--teal); }

  .pes-foot{
    margin-top:0.15rem;
    font-size:0.68rem;
    color:var(--muted);
    flex-shrink:0;
  }
  .pes-foot a{ color:inherit; }

  .pes-mobile-stage{
    display:none;
    font-size:0.86rem;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
  }
  @media (max-width:560px){
    .pes-intro .hint{ display:none; }
    .pes-node text{ display:none; }
    .pes-mobile-stage{ display:inline-block; }
    .pes-speed label{ display:none; }
    .pes-speed input[type="range"]{ width:64px; }
  }
  @media (max-width:700px){
    .pes-wrap{padding:0.35rem 0.5rem 0.45rem;}
    .pes-intro .hint{display:none;}
    .pes-intro p{font-size:1.02rem;}
  }

  @media (prefers-reduced-motion: reduce){
    .pes-canvas-frame{ scroll-behavior:auto; }
  }

  /* Crisp DOM labels projected from 3D (avoids soft CanvasTexture sprites). */
  .pes-label-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:2;
  }
  .pes-3d-label{
    position:absolute;
    left:0; top:0;
    white-space:nowrap;
    font-family:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.01em;
    color:var(--ink);
    /* Hard halo only — soft glow made the labels look blurry. */
    text-shadow:
      -1px 0 0 var(--paper),
      1px 0 0 var(--paper),
      0 -1px 0 var(--paper),
      0 1px 0 var(--paper);
    will-change:transform;
    opacity:0;
  }
  .pes-3d-label.muted{
    font-weight:500;
    font-size:12px;
    color:var(--muted);
  }
</style>
</head>
<body>

<div class="pes-wrap">
  <div class="pes-intro">
    <p>From potential energy surface to reaction dynamics</p>
    <p class="hint">drag to rotate · scroll to zoom</p>
  </div>

  <div class="pes-canvas-frame" id="pesFrame">
    <div class="pes-label-layer" id="pesLabelLayer" aria-hidden="true"></div>
  </div>

  <div class="pes-controls">
    <button class="pes-play" id="pesPlay" aria-label="Play">
      <svg id="pesPlayIcon" viewBox="0 0 16 16" fill="currentColor"><polygon points="3,1 15,8 3,15"></polygon></svg>
    </button>
    <div class="pes-stepper"><svg id="pesStepperSvg"></svg></div>
    <span class="pes-mobile-stage" id="pesMobileStage"></span>
    <div class="pes-speed" title="Animation speed">
      <label for="pesSpeed">Speed</label>
      <input type="range" id="pesSpeed" min="0.25" max="2.5" step="0.05" value="1" aria-label="Animation speed">
      <span id="pesSpeedVal">1.0×</span>
    </div>
  </div>

  <p class="pes-stage" id="pesStageCaption" aria-live="polite"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // Palette
  // ---------------------------------------------------------------
  const COL = {
    ink: 0x1b2430, copper: 0xb5541c, teal: 0x0f6f66, gold: 0xd1a13a,
    sample: 0x1f8fa0, muted: 0x9aa08f
  };
  const STAGE_NAMES = ["Sampling configurations", "Ab initio energies", "Fitting the PES", "Reaction dynamics"];
  const STAGE_CAPTIONS = [
    "Sampling configurations across the molecular space",
    "Calculating ab-initio energy for each geometry using state-of-art electronic structure methods",
    "A surface is fit through the energies and refined until it matches them",
    "A trajectory moving across the surface, reactants to products"
  ];
  const STAGE_DUR = [2600, 2600, 7000, 5200]; // ms, one full pass
  const HOLD_MS = 1400; // pause on the finished trajectory before looping

  // ---------------------------------------------------------------
  // PES definition — three shallow wells (left / centre-deep / right)
  // ---------------------------------------------------------------
  const WELLS = [
    [0.17, 0.40, 0.70, 0.085, 0.19],
    [0.50, 0.52, 1.00, 0.110, 0.140],
    [0.83, 0.64, 0.80, 0.090, 0.140],
  ];
  function V(x, y) {
    let v = 0.25 * ((x - 0.5) ** 2 + (y - 0.5) ** 2);
    for (const [x0, y0, a, sx, sy] of WELLS) {
      v -= a * Math.exp(-(((x - x0) ** 2) / (2 * sx * sx) + ((y - y0) ** 2) / (2 * sy * sy)));
    }
    return v;
  }

  const N = 64;
  const heights = new Float32Array(N * N);
  let zmin = Infinity, zmax = -Infinity;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const x = i / (N - 1), y = j / (N - 1);
      const v = V(x, y);
      heights[i * N + j] = v;
      if (v < zmin) zmin = v;
      if (v > zmax) zmax = v;
    }
  }

  const floorY = 0.0;
  // A square footprint with near-full-height relief makes this look like a
  // spiky tent; matplotlib's pleasant "landscape" read comes from
  // elongating one horizontal axis and compressing the vertical one
  // (box_aspect). Match that here instead of a 1:1:1 box.
  const SCALE_X = 9.4;     // R1 footprint (elongated)
  const SCALE_Z = 6.0;     // R2 footprint
  const HSCALE = 3.6;      // vertical relief, compressed relative to footprint

  function worldX(x) { return (x - 0.5) * SCALE_X; }
  function worldZ(y) { return (y - 0.5) * SCALE_Z; }
  function worldY(v) { return (v - zmin) / (zmax - zmin) * HSCALE; }

  function smoothstep(t) { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  const RAMP = [
    [0x0c,0x4a,0x6e],[0x0e,0x74,0x90],[0x14,0xb8,0xa6],
    [0xa7,0xc9,0x57],[0xd1,0xa1,0x3a],[0xfb,0xe8,0xa6],
  ];
  function rampColor(t) {
    t = Math.min(1, Math.max(0, t));
    const n = RAMP.length - 1;
    const f = t * n;
    const i = Math.min(n - 1, Math.floor(f));
    const fr = f - i;
    const c0 = RAMP[i], c1 = RAMP[i + 1];
    return [
      lerp(c0[0], c1[0], fr) / 255,
      lerp(c0[1], c1[1], fr) / 255,
      lerp(c0[2], c1[2], fr) / 255,
    ];
  }

  // ---------------------------------------------------------------
  // Sample points (configurations)
  // ---------------------------------------------------------------
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(7);
  const NP = 140;
  const PX = new Float32Array(NP), PY = new Float32Array(NP), PZ = new Float32Array(NP);
  const order = new Float32Array(NP);
  for (let k = 0; k < NP; k++) {
    PX[k] = 0.04 + rnd() * 0.92;
    PY[k] = 0.04 + rnd() * 0.92;
    PZ[k] = V(PX[k], PY[k]);
    order[k] = k;
  }
  // shuffle order (deterministic) for staggered reveal / lift timing
  for (let k = NP - 1; k > 0; k--) {
    const j = Math.floor(rnd() * (k + 1));
    const tmp = order[k]; order[k] = order[j]; order[j] = tmp;
  }
  const lagOf = new Float32Array(NP);
  for (let k = 0; k < NP; k++) lagOf[order[k]] = (k / NP) * 0.55;

  // ---------------------------------------------------------------
  // Progressive fit: a sequence of Gaussian RBF fits that use more and more
  // of the ab initio points, so the surface visibly improves step by step.
  // Level 0 is a flat plane at the mean energy; the last level is the
  // converged surface that the dynamics stage runs on.
  // ---------------------------------------------------------------
  // farthest-point ordering, so every fit level covers the whole landscape
  const fitRank = new Int32Array(NP);
  const fitOrder = [0];
  {
    const dmin = new Float32Array(NP).fill(Infinity);
    for (let r = 1; r < NP; r++) {
      const last = fitOrder[r - 1];
      let best = -1, bestD = -1;
      for (let k = 0; k < NP; k++) {
        const d = (PX[k] - PX[last]) ** 2 + (PY[k] - PY[last]) ** 2;
        if (d < dmin[k]) dmin[k] = d;
        if (dmin[k] > bestD && !fitOrder.includes(k)) { bestD = dmin[k]; best = k; }
      }
      fitOrder.push(best);
    }
    fitOrder.forEach((k, r) => { fitRank[k] = r; });
  }

  function rbfFit(n) {
    const idx = fitOrder.slice(0, n);
    const eps = Math.max(0.17, 0.45 / Math.sqrt(n / 6));   // wide early, narrower as points are added
    const e2 = eps * eps;
    let mean = 0;
    for (const k of idx) mean += PZ[k];
    mean /= n;
    // (Phi + lambda I) w = z - mean, solved by Cholesky
    const A = new Float64Array(n * n), w = new Float64Array(n);
    for (let a = 0; a < n; a++) {
      w[a] = PZ[idx[a]] - mean;
      for (let b = 0; b <= a; b++) {
        const d2 = (PX[idx[a]] - PX[idx[b]]) ** 2 + (PY[idx[a]] - PY[idx[b]]) ** 2;
        A[a * n + b] = A[b * n + a] = Math.exp(-d2 / e2);
      }
      A[a * n + a] += 1e-5;
    }
    for (let j = 0; j < n; j++) {
      let s = A[j * n + j];
      for (let k = 0; k < j; k++) s -= A[j * n + k] ** 2;
      const d = Math.sqrt(Math.max(s, 1e-12));
      A[j * n + j] = d;
      for (let i = j + 1; i < n; i++) {
        let t = A[i * n + j];
        for (let k = 0; k < j; k++) t -= A[i * n + k] * A[j * n + k];
        A[i * n + j] = t / d;
      }
    }
    for (let i = 0; i < n; i++) { let t = w[i]; for (let k = 0; k < i; k++) t -= A[i * n + k] * w[k]; w[i] = t / A[i * n + i]; }
    for (let i = n - 1; i >= 0; i--) { let t = w[i]; for (let k = i + 1; k < n; k++) t -= A[k * n + i] * w[k]; w[i] = t / A[i * n + i]; }
    // evaluate on the grid (the Gaussian is separable in x and y)
    const out = new Float32Array(N * N).fill(mean);
    const ex = new Float32Array(N), ey = new Float32Array(N);
    for (let a = 0; a < n; a++) {
      const kx = PX[idx[a]], ky = PY[idx[a]];
      for (let i = 0; i < N; i++) {
        ex[i] = Math.exp(-((i / (N - 1) - kx) ** 2) / e2);
        ey[i] = Math.exp(-((i / (N - 1) - ky) ** 2) / e2);
      }
      for (let i = 0; i < N; i++) {
        const wi = w[a] * ex[i];
        if (Math.abs(wi) < 1e-7) continue;
        for (let j = 0; j < N; j++) out[i * N + j] += wi * ey[j];
      }
    }
    return out;
  }

  const FIT_COUNTS = [6, 10, 16, 24, 36, 52, 72, 96, 120, NP];
  const FIT_LEVELS = [];
  const FIT_NUSED = [0];
  {
    let meanAll = 0;
    for (let k = 0; k < NP; k++) meanAll += PZ[k];
    FIT_LEVELS.push(new Float32Array(N * N).fill(meanAll / NP));
    for (const n of FIT_COUNTS) { FIT_LEVELS.push(rbfFit(n)); FIT_NUSED.push(n); }
    FIT_LEVELS.push(heights);            // converged surface
    FIT_NUSED.push(NP);
  }
  const FIT_STEPS = FIT_LEVELS.length - 1;

  function sampleGrid(arr, x, y) {       // bilinear lookup, x/y in [0,1]
    const fx = Math.min(N - 1.001, Math.max(0, x * (N - 1)));
    const fy = Math.min(N - 1.001, Math.max(0, y * (N - 1)));
    const i = Math.floor(fx), j = Math.floor(fy), u = fx - i, v = fy - j;
    return (1 - u) * (1 - v) * arr[i * N + j] + u * (1 - v) * arr[(i + 1) * N + j]
         + (1 - u) * v * arr[i * N + j + 1] + u * v * arr[(i + 1) * N + j + 1];
  }

  // ---------------------------------------------------------------
  // Trajectory (Catmull-Rom through the same reactant->product route)
  // ---------------------------------------------------------------
  const WAY = [
    [0.15,0.33],[0.19,0.46],[0.15,0.41],[0.21,0.43],[0.33,0.47],
    [0.45,0.49],[0.54,0.57],[0.47,0.54],[0.55,0.50],[0.67,0.58],
    [0.79,0.67],[0.86,0.62],[0.81,0.65],[0.83,0.64]
  ];
  function trajXY(s) {
    const n = WAY.length - 1;
    const u = Math.min(1, Math.max(0, s)) * n;
    const i = Math.min(n - 1, Math.floor(u));
    const f = u - i;
    const p0 = WAY[Math.max(i - 1, 0)], p1 = WAY[i], p2 = WAY[i + 1], p3 = WAY[Math.min(i + 2, n)];
    const qx = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * f + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0]) * f*f + (-p0[0]+3*p1[0]-3*p2[0]+p3[0]) * f*f*f);
    const qy = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * f + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1]) * f*f + (-p0[1]+3*p1[1]-3*p2[1]+p3[1]) * f*f*f);
    return [qx, qy];
  }
  const PATH_N = 260;
  const PATH = [];
  for (let k = 0; k < PATH_N; k++) {
    const s = k / (PATH_N - 1);
    const [x, y] = trajXY(s);
    PATH.push([x, y, V(x, y) + 0.03]);
  }

  // ---------------------------------------------------------------
  // Three.js scene
  // ---------------------------------------------------------------
  const frame = document.getElementById("pesFrame");
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  frame.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const dl = new THREE.DirectionalLight(0xffffff, 0.65);
  dl.position.set(4, 8, 5);
  scene.add(dl);

  // --- orbit state (manual, no extra dependency) ---
  let azim = -0.95, elev = 0.5, radius = 16.5;
  const target = new THREE.Vector3(0, HSCALE * 0.5, 0);
  function updateCamera() {
    const e = Math.min(1.15, Math.max(0.18, elev));
    camera.position.set(
      target.x + radius * Math.cos(e) * Math.sin(azim),
      target.y + radius * Math.sin(e),
      target.z + radius * Math.cos(e) * Math.cos(azim)
    );
    camera.lookAt(target);
  }
  updateCamera();

  // --- surface mesh ---
  const surfGeo = new THREE.PlaneGeometry(SCALE_X, SCALE_Z, N - 1, N - 1);
  surfGeo.rotateX(-Math.PI / 2);
  const surfPos = surfGeo.attributes.position;
  const surfColor = new Float32Array(surfPos.count * 3);
  surfGeo.setAttribute("color", new THREE.BufferAttribute(surfColor, 3));
  const surfMat = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.85, metalness: 0.0,
    side: THREE.DoubleSide, wireframe: false, transparent: true, opacity: 1
  });
  const surfMesh = new THREE.Mesh(surfGeo, surfMat);
  scene.add(surfMesh);

  // thin wire overlay for a hand-drafted, technical feel
  const wireMat = new THREE.MeshBasicMaterial({ color: COL.ink, wireframe: true, transparent: true, opacity: 0.06 });
  const wireMesh = new THREE.Mesh(surfGeo, wireMat);
  scene.add(wireMesh);

  function setSurfaceHeights(hArr) {
    const gridW = N; // plane's (widthSeg+1) matches N because we built with N-1 segments
    for (let iy = 0; iy < N; iy++) {
      for (let ix = 0; ix < N; ix++) {
        const srcIdx = ix * N + iy; // heights indexed [i*N+j] with i along x, j along y
        // PlaneGeometry vertex order: row-major, y from +half to -half, x from -half to +half
        const vIdx = iy * gridW + ix;
        const v = hArr[srcIdx];
        surfPos.setY(vIdx, worldY(v));
        const c = rampColor((v - zmin) / (zmax - zmin));
        surfColor[vIdx * 3] = c[0]; surfColor[vIdx * 3 + 1] = c[1]; surfColor[vIdx * 3 + 2] = c[2];
      }
    }
    surfPos.needsUpdate = true;
    surfGeo.attributes.color.needsUpdate = true;
    surfGeo.computeVertexNormals();
  }

  // --- floor "contour map" plane (banded colour, no displacement) ---
  const floorGeo = new THREE.PlaneGeometry(SCALE_X, SCALE_Z, N - 1, N - 1);
  floorGeo.rotateX(-Math.PI / 2);
  floorGeo.translate(0, floorY, 0);
  const floorColor = new Float32Array(floorGeo.attributes.position.count * 3);
  floorGeo.setAttribute("color", new THREE.BufferAttribute(floorColor, 3));
  for (let iy = 0; iy < N; iy++) {
    for (let ix = 0; ix < N; ix++) {
      const srcIdx = ix * N + iy;
      const vIdx = iy * N + ix;
      const t = (heights[srcIdx] - zmin) / (zmax - zmin);
      const banded = Math.round(t * 9) / 9;
      const c = rampColor(banded);
      floorColor[vIdx * 3] = c[0]; floorColor[vIdx * 3 + 1] = c[1]; floorColor[vIdx * 3 + 2] = c[2];
    }
  }
  floorGeo.attributes.color.needsUpdate = true;
  const floorMat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.4 });
  const floorMesh = new THREE.Mesh(floorGeo, floorMat);
  scene.add(floorMesh);

  // --- sample points ---
  const ptGeo = new THREE.BufferGeometry();
  const ptPos = new Float32Array(NP * 3);
  const ptCol = new Float32Array(NP * 3);
  const ptAlpha = new Float32Array(NP);
  ptGeo.setAttribute("position", new THREE.BufferAttribute(ptPos, 3));
  ptGeo.setAttribute("color", new THREE.BufferAttribute(ptCol, 3));
  const sampleColHex = new THREE.Color(COL.sample);
  for (let k = 0; k < NP; k++) {
    ptCol[k*3] = sampleColHex.r; ptCol[k*3+1] = sampleColHex.g; ptCol[k*3+2] = sampleColHex.b;
  }
  const ptMat = new THREE.PointsMaterial({
    size: 0.20, vertexColors: true, transparent: true, opacity: 1,
    sizeAttenuation: true, depthWrite: false
  });
  const points = new THREE.Points(ptGeo, ptMat);
  scene.add(points);

  // Vertical "energy sticks" make the ab initio calculation visually explicit:
  // each sampled configuration is connected from the configuration plane to
  // its computed energy. They are only shown during the ab initio stage.
  const energyStickPos = new Float32Array(NP * 6);
  const energyStickGeo = new THREE.BufferGeometry();
  energyStickGeo.setAttribute("position", new THREE.BufferAttribute(energyStickPos, 3));
  const energyStickMat = new THREE.LineBasicMaterial({
    color: COL.copper, transparent: true, opacity: 0.9
  });
  const energySticks = new THREE.LineSegments(energyStickGeo, energyStickMat);
  energySticks.visible = false;
  scene.add(energySticks);

  function updateEnergySticks(t) {
    for (let k = 0; k < NP; k++) {
      const lift = smoothstep((t - lagOf[k]) / 0.45);
      const x = worldX(PX[k]), z = worldZ(PY[k]);
      const y0 = worldY(zmin) - 0.02;
      const y1 = lerp(y0, worldY(PZ[k]), lift);
      energyStickPos[k*6] = x;
      energyStickPos[k*6+1] = y0;
      energyStickPos[k*6+2] = z;
      energyStickPos[k*6+3] = x;
      energyStickPos[k*6+4] = y1;
      energyStickPos[k*6+5] = z;
    }
    energyStickGeo.attributes.position.needsUpdate = true;
  }

  function setPoints(px, py, pz, opacity) {
    for (let k = 0; k < NP; k++) {
      ptPos[k*3] = worldX(px[k]);
      ptPos[k*3+1] = worldY(pz[k]);
      ptPos[k*3+2] = worldZ(py[k]);
    }
    ptGeo.attributes.position.needsUpdate = true;
    ptMat.opacity = opacity;
  }

  // --- trajectory line + leading marker ---
  const pathPos = new Float32Array(PATH_N * 3);
  const pathGeo = new THREE.BufferGeometry();
  pathGeo.setAttribute("position", new THREE.BufferAttribute(pathPos, 3));
  pathGeo.setDrawRange(0, 0);
  const pathMat = new THREE.LineBasicMaterial({ color: COL.copper, linewidth: 2 });
  const pathLine = new THREE.Line(pathGeo, pathMat);
  scene.add(pathLine);

  const headGeo = new THREE.SphereGeometry(0.09, 16, 16);
  const headMat = new THREE.MeshStandardMaterial({ color: COL.copper, roughness: 0.4 });
  const head = new THREE.Mesh(headGeo, headMat);
  scene.add(head);
  head.visible = false;

  // --- crisp HTML labels projected from 3D (axis + reactant/product) ---
  const labelLayer = document.getElementById("pesLabelLayer");
  const _proj = new THREE.Vector3();
  function makeLabel(text, muted) {
    const el = document.createElement("div");
    el.className = "pes-3d-label" + (muted ? " muted" : "");
    el.textContent = text;
    labelLayer.appendChild(el);
    return {
      el,
      position: new THREE.Vector3(),
      visible: true,
      set(x, y, z) { this.position.set(x, y, z); return this; }
    };
  }
  function syncLabels() {
    const w = frame.clientWidth, h = frame.clientHeight;
    for (let i = 0; i < htmlLabels.length; i++) {
      const lbl = htmlLabels[i];
      if (!lbl.visible) {
        lbl.el.style.opacity = "0";
        continue;
      }
      _proj.copy(lbl.position).project(camera);
      const onScreen = _proj.z > -1 && _proj.z < 1
        && _proj.x >= -1.2 && _proj.x <= 1.2
        && _proj.y >= -1.2 && _proj.y <= 1.2;
      if (!onScreen) {
        lbl.el.style.opacity = "0";
        continue;
      }
      const x = (_proj.x * 0.5 + 0.5) * w;
      const y = (-_proj.y * 0.5 + 0.5) * h;
      lbl.el.style.transform = "translate(-50%, -50%) translate(" + x + "px," + y + "px)";
      lbl.el.style.opacity = "1";
    }
  }
  function paint() {
    renderer.render(scene, camera);
    syncLabels();
  }

  const axR1 = makeLabel("R\u2081", true).set(worldX(1.02), 0.05, worldZ(-0.04));
  const axR2 = makeLabel("R\u2082", true).set(worldX(-0.04), 0.05, worldZ(1.02));
  const axE  = makeLabel("E", true).set(worldX(-0.06), HSCALE * 0.55, worldZ(-0.06));
  const lblReact = makeLabel("Reactants", false).set(worldX(0.17), worldY(V(0.17,0.40)) + 1.1, worldZ(0.40));
  const lblProd = makeLabel("Products", false).set(worldX(0.83), worldY(V(0.83,0.64)) + 1.1, worldZ(0.64));
  lblReact.visible = false;
  lblProd.visible = false;
  const htmlLabels = [axR1, axR2, axE, lblReact, lblProd];

  // ---------------------------------------------------------------
  // Resize
  // ---------------------------------------------------------------
  function resize() {
    const w = frame.clientWidth, h = frame.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------------------------------------------------------------
  // Pointer drag / wheel zoom
  // ---------------------------------------------------------------
  let dragging = false, lastX = 0, lastY = 0;
  frame.addEventListener("pointerdown", (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    frame.setPointerCapture(e.pointerId);
  });
  frame.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    azim -= dx * 0.006;
    elev += dy * 0.005;
    updateCamera();
  });
  frame.addEventListener("pointerup", () => { dragging = false; });
  frame.addEventListener("pointerleave", () => { dragging = false; });
  frame.addEventListener("wheel", (e) => {
    e.preventDefault();
    radius = Math.min(28, Math.max(9, radius + e.deltaY * 0.01));
    updateCamera();
  }, { passive: false });

  // ---------------------------------------------------------------
  // Stepper UI: a light progress bar that fills continuously, with the
  // four stages as dark milestone dots. Dot i sits where stage i begins;
  // the bar's right end is the end of the dynamics stage.
  // ---------------------------------------------------------------
  const stepperSvg = document.getElementById("pesStepperSvg");
  const stageCaption = document.getElementById("pesStageCaption");
  const mobileStage = document.getElementById("pesMobileStage");
  const bar = { x0: 0, seg: 0, fill: null, len: 0, progress: 0 };
  function buildStepper() {
    const w = document.querySelector(".pes-stepper").clientWidth || 600;
    const h = 34;
    const y = h / 2 + 4;
    bar.x0 = 0.03 * w;
    bar.seg = (0.97 * w - bar.x0) / 4;
    const xs = [0, 1, 2, 3].map(i => bar.x0 + i * bar.seg);
    const xEnd = bar.x0 + 4 * bar.seg;
    // each label reads along its own segment; short names when segments are narrow
    const labels = bar.seg < 160 ? ["Sampling", "Ab initio", "Fitting", "Dynamics"] : STAGE_NAMES;
    // gentle arcs between milestones, the same shape for every segment
    let path = `M ${bar.x0} ${y}`;
    for (let i = 1; i <= 4; i++) {
      const xa = bar.x0 + (i - 1) * bar.seg, xb = bar.x0 + i * bar.seg;
      path += ` Q ${(xa + xb) / 2} ${y - 9} ${xb} ${y}`;
    }
    let svg = `<path d="${path}" fill="none" stroke="var(--bar-track)" stroke-width="6" stroke-linecap="round"/>
      <path id="pesBarFill" d="${path}" fill="none" stroke="var(--bar-fill)" stroke-width="6" stroke-linecap="round"/>`;
    xs.forEach((x, i) => {
      svg += `<g class="pes-node" data-i="${i}">
        <circle cx="${x}" cy="${y}" r="11" fill="transparent" data-role="hit"/>
        <circle cx="${x}" cy="${y}" r="9" fill="none" stroke="var(--ink)" stroke-width="1.4" opacity="0" data-role="halo"/>
        <circle cx="${x}" cy="${y}" r="5" fill="var(--ink)" stroke="var(--paper)" stroke-width="2" data-role="dot"/>
        <text x="${x - 4}" y="${y - 13}" text-anchor="start">${labels[i]}</text>
      </g>`;
    });
    stepperSvg.innerHTML = svg;
    bar.fill = stepperSvg.querySelector("#pesBarFill");
    bar.len = bar.fill.getTotalLength();
    bar.fill.setAttribute("stroke-dasharray", `${bar.len} ${bar.len}`);
    stepperSvg.querySelectorAll(".pes-node").forEach((g) => {
      g.addEventListener("click", () => jumpTo(parseInt(g.dataset.i, 10)));
    });
    setBar(bar.progress);
    paintStepper(stage);
  }
  // progress runs 0..4: stage index plus the fraction of that stage done
  function setBar(progress) {
    bar.progress = Math.min(4, Math.max(0, progress));
    if (!bar.fill) return;
    // segments are identical arcs, so arc length is proportional to progress
    bar.fill.setAttribute("stroke-dashoffset", bar.len * (1 - bar.progress / 4));
    bar.fill.style.visibility = bar.progress < 0.002 ? "hidden" : "visible";
  }
  function paintStepper(stage) {
    stepperSvg.querySelectorAll(".pes-node").forEach((g) => {
      const i = parseInt(g.dataset.i, 10);
      g.classList.remove("active", "done");
      if (i < stage) g.classList.add("done");
      else if (i === stage) g.classList.add("active");
      g.querySelector('[data-role="dot"]').setAttribute("r", i === stage ? 6.5 : 5);
      g.querySelector('[data-role="halo"]').setAttribute("opacity", i === stage ? 0.35 : 0);
    });
  }
  // ---------------------------------------------------------------
  // Animation state machine
  // ---------------------------------------------------------------
  let stage = 0;       // 0..3
  let stageStart = performance.now();
  let playing = false;
  let holdUntil = null;
  let speed = 1;

  function stageDur(s) { return STAGE_DUR[s] / speed; }
  function holdDur() { return HOLD_MS / speed; }

  const speedInput = document.getElementById("pesSpeed");
  const speedVal = document.getElementById("pesSpeedVal");
  function setSpeed(v, fromInput) {
    const next = Math.min(2.5, Math.max(0.25, Number(v) || 1));
    // Keep the current frame when the rate changes.
    if (playing && holdUntil === null && next !== speed) {
      stageStart = performance.now() - currentFrac * (STAGE_DUR[stage] / next);
    }
    speed = next;
    speedVal.textContent = speed.toFixed(2) + "\u00d7";
    // Never rewrite the range value during drag — that makes the thumb jump.
    if (!fromInput && speedInput.valueAsNumber !== speed) {
      speedInput.value = String(speed);
    }
  }
  speedInput.addEventListener("input", () => setSpeed(speedInput.value, true));
  // Keep wheel on the slider from also zooming the 3D view underneath.
  speedInput.addEventListener("wheel", (e) => e.stopPropagation(), { passive: true });
  setSpeed(speedInput.value, false);

  const playBtn = document.getElementById("pesPlay");
  const playIcon = document.getElementById("pesPlayIcon");
  function setPlayIcon() {
    playIcon.innerHTML = playing
      ? '<rect x="3" y="2" width="3.4" height="12"></rect><rect x="9.6" y="2" width="3.4" height="12"></rect>'
      : '<polygon points="3,1 15,8 3,15"></polygon>';
  }
  playBtn.addEventListener("click", () => {
    playing = !playing;
    if (playing) { stageStart = performance.now() - currentFrac * stageDur(stage); holdUntil = null; }
    setPlayIcon();
  });

  function jumpTo(i) {
    stage = i;
    currentFrac = 0;
    stageStart = performance.now();
    playing = true;
    holdUntil = null;
    setPlayIcon();
    renderStage(stage, 0);
    setBar(stage);
  }

  let currentFrac = 0;
  buildStepper();
  window.addEventListener("resize", buildStepper);

  function renderStage(s, t) {
    stageCaption.textContent = STAGE_CAPTIONS[s];
    mobileStage.textContent = STAGE_NAMES[s];
    paintStepper(s);
    lblReact.visible = false; lblProd.visible = false;
    head.visible = false;
    pathLine.visible = false;
    floorMesh.material.opacity = 0.22;
    energySticks.visible = false;
    energyStickMat.opacity = 0.9;
    surfMat.opacity = 1;
    wireMat.opacity = 0.06;

    if (s === 0) {
      // Sampling: points appear on the floor, staggered by shuffled order.
      // Points not yet "revealed" are parked far outside the view frustum
      // (colour alone can't hide a vertex-coloured point — it just goes
      // black instead of invisible).
      // Keep a visible seed of configurations at the very start, then
      // reveal the rest across the sampling stage. This makes the
      // "Sampling configurations" state readable even on the first frame.
      const n = Math.ceil(NP * (0.22 + 0.78 * smoothstep(t / 0.72)));
      for (let k = 0; k < NP; k++) {
        const revealed = k < n;
        ptPos[k*3]   = revealed ? worldX(PX[k]) : 9999;
        ptPos[k*3+1] = revealed ? 0.055 : 9999;
        ptPos[k*3+2] = revealed ? worldZ(PY[k]) : 9999;
        ptCol[k*3]   = sampleColHex.r;
        ptCol[k*3+1] = sampleColHex.g;
        ptCol[k*3+2] = sampleColHex.b;
      }
      ptGeo.attributes.position.needsUpdate = true;
      ptGeo.attributes.color.needsUpdate = true;
      ptMat.opacity = 1;
      surfMesh.visible = false;
      wireMesh.visible = false;

    } else if (s === 1) {
      // Ab initio energies: points lift from floor to their true energy, staggered
      const px = PX, py = PY;
      const pz = new Float32Array(NP);
      for (let k = 0; k < NP; k++) {
        const lift = smoothstep((t - lagOf[k]) / 0.45);
        pz[k] = lerp(zmin, PZ[k], lift);
        ptCol[k*3] = sampleColHex.r; ptCol[k*3+1] = sampleColHex.g; ptCol[k*3+2] = sampleColHex.b;
      }
      ptGeo.attributes.color.needsUpdate = true;
      setPoints(px, py, pz, 1);
      updateEnergySticks(t);
      energySticks.visible = true;
      surfMesh.visible = false;
      wireMesh.visible = false;

    } else if (s === 2) {
      // Fit PES: a flat plane fades in, then steps through fits that use more
      // and more points; residual lines from each point to the surface shrink.
      surfMesh.visible = true; wireMesh.visible = true;
      const fadeIn = smoothstep(t / 0.07);
      surfMat.opacity = fadeIn;
      wireMat.opacity = 0.06 * fadeIn;
      const p = FIT_STEPS * Math.min(1, Math.max(0, (t - 0.05) / 0.83));   // fit progress in levels
      const lv = Math.min(FIT_STEPS - 1, Math.floor(p));
      const f = smoothstep(p - lv);                                     // each refinement settles in
      const A = FIT_LEVELS[lv], B = FIT_LEVELS[lv + 1];
      const blended = new Float32Array(N * N);
      let se = 0;
      for (let idx = 0; idx < N * N; idx++) {
        blended[idx] = lerp(A[idx], B[idx], f);
        se += (blended[idx] - heights[idx]) ** 2;
      }
      setSurfaceHeights(blended);
      // const rmse = Math.sqrt(se / (N * N));
      const nUsed = Math.round(lerp(FIT_NUSED[lv], FIT_NUSED[lv + 1], f));
      // stageCaption.textContent = t >= 0.88
      //   ? `${STAGE_CAPTIONS[2]} Converged: ${NP} points, RMSE ${rmse.toFixed(3)}.`
      //   : `Fit ${Math.min(FIT_STEPS, lv + 1)} of ${FIT_STEPS} · ${nUsed} of ${NP} points · RMSE ${rmse.toFixed(3)}`;

      // points: ones already in the fit are coloured by how far the surface
      // still misses them (copper = far, teal = on the surface); the rest stay muted
      const teal = new THREE.Color(COL.teal), copper = new THREE.Color(COL.copper), muted = new THREE.Color(COL.muted);
      const c = new THREE.Color();
      for (let k = 0; k < NP; k++) {
        const surfV = sampleGrid(blended, PX[k], PY[k]);
        const res = Math.abs(surfV - PZ[k]);
        if (fitRank[k] < nUsed) c.copy(teal).lerp(copper, Math.min(1, res / 0.12));
        else c.copy(muted);
        ptCol[k*3] = c.r; ptCol[k*3+1] = c.g; ptCol[k*3+2] = c.b;
        // residual line from the point to the current surface
        const x = worldX(PX[k]), z = worldZ(PY[k]);
        energyStickPos[k*6] = x; energyStickPos[k*6+1] = worldY(PZ[k]); energyStickPos[k*6+2] = z;
        energyStickPos[k*6+3] = x; energyStickPos[k*6+4] = worldY(surfV); energyStickPos[k*6+5] = z;
      }
      ptGeo.attributes.color.needsUpdate = true;
      energyStickGeo.attributes.position.needsUpdate = true;
      energySticks.visible = true;
      energyStickMat.opacity = 0.75 * (1 - smoothstep((t - 0.86) / 0.12));
      const op = 1 - 0.8 * smoothstep((t - 0.88) / 0.12);
      setPoints(PX, PY, PZ, op);

    } else {
      // Dynamics: static fitted surface + trajectory reveal
      surfMesh.visible = true; wireMesh.visible = true;
      setSurfaceHeights(heights);
      ptMat.opacity = 0;
      lblReact.visible = true; lblProd.visible = true;
      pathLine.visible = true;

      const shown = Math.max(2, Math.floor(PATH_N * t));
      for (let k = 0; k < shown; k++) {
        pathPos[k*3]   = worldX(PATH[k][0]);
        pathPos[k*3+1] = worldY(PATH[k][2]) + 0.03;
        pathPos[k*3+2] = worldZ(PATH[k][1]);
      }
      pathGeo.attributes.position.needsUpdate = true;
      pathGeo.setDrawRange(0, shown);
      const last = PATH[shown - 1];
      head.visible = true;
      head.position.set(worldX(last[0]), worldY(last[2]) + 0.03, worldZ(last[1]));
    }
  }
  function tick(now) {
    requestAnimationFrame(tick);

    if (!playing) {
      paint();
      return;
    }

    if (holdUntil !== null) {
      if (now >= holdUntil) {
        holdUntil = null;
        stage = 0;
        currentFrac = 0;
        stageStart = now;
        renderStage(0, 0);
        setBar(0);
      }
      paint();
      return;
    }

    const elapsed = now - stageStart;
    let frac = elapsed / stageDur(stage);
    if (frac >= 1) {
      if (stage < 3) {
        stage += 1;
        stageStart = now;
        frac = 0;
      } else {
        frac = 1;
        holdUntil = now + holdDur();
      }
    }
    currentFrac = frac;
    renderStage(stage, frac);
    setBar(stage + frac);
    paint();
  }

  // First paint before animation loop takes over
  renderStage(0, 1);
  setBar(0);
  paint();
  setPlayIcon();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
